version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions-minor:
        update-types:
          - "minor"
          - "patch"
  # NOTE: there is deliberately no "pip" ecosystem entry. This repo has no
  # runtime dependencies (manifest.json `requirements: []` — everything comes
  # from Home Assistant) and no requirements file or [project] section for
  # Dependabot to read; pyproject.toml is tool config only. A pip block here
  # matched nothing and produced a false "dependencies are monitored" signal.
  # The dev tools are resolved per-run by uv in the CI workflow.
