name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A PR that gets three pushes in a minute should run these four gates once,
# not three times.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Ruff (lint)
        run: |
          uv run --python '>=3.14.2' --with ruff \
            ruff check custom_components/ tests/

      - name: Ruff (format check)
        run: |
          uv run --python '>=3.14.2' --with ruff \
            ruff format --check custom_components/ tests/

      - name: Mypy (strict)
        run: |
          uv run --python '>=3.14.2' \
            --with mypy \
            --with homeassistant \
            --with aiohttp \
            --with voluptuous \
            mypy custom_components/airvisual_outdoor/

      - name: Pytest (with coverage gate)
        run: |
          uv run --python '>=3.14.2' \
            --with pytest-homeassistant-custom-component \
            --with pytest-cov \
            python -m pytest tests/ -v \
              --cov=custom_components.airvisual_outdoor \
              --cov-report=term-missing \
              --cov-fail-under=100
